<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1049 1024" font-family="Archivo, sans-serif">
  <rect x="0" y="0" width="1049" height="1024" fill="#f4eee1"/>

  <!-- ===== Panel 1 : élévation face, caisson fermé (lit relevé) ===== -->
  <g stroke="#b5502f" stroke-width="4" fill="none" stroke-linejoin="round">
    <!-- caisson mural -->
    <rect x="120" y="150" width="300" height="650" />
    <!-- montants verticaux (structure du caisson) -->
    <line x1="150" y1="150" x2="150" y2="800"/>
    <line x1="390" y1="150" x2="390" y2="800"/>
    <!-- lit relevé, sous la corniche -->
    <rect x="128" y="158" width="284" height="90"/>
    <!-- étagères -->
    <line x1="128" y1="330" x2="412" y2="330"/>
    <line x1="128" y1="410" x2="412" y2="410"/>
    <line x1="270" y1="248" x2="270" y2="410"/>
    <!-- canapé intégré en bas -->
    <path d="M128,700 q0,-40 40,-40 h204 q40,0 40,40 v70 h-284 z"/>
    <line x1="128" y1="730" x2="412" y2="730"/>
  </g>
  <text x="270" y="900" font-size="26" fill="#9c4326" font-weight="700" text-anchor="middle">DE JOUR — LIT RELEVÉ, CANAPÉ LIBRE</text>

  <!-- ===== Panel 2 : coupe latérale, charnière basse + vérins à gaz ===== -->
  <g stroke="#b5502f" stroke-width="4" fill="none" stroke-linejoin="round">
    <!-- mur -->
    <rect x="620" y="120" width="30" height="700" fill="#f6ddc9"/>
    <!-- caisson mural, vu en coupe -->
    <rect x="650" y="150" width="90" height="620"/>
    <!-- lit fermé (position verticale, pointillé = position alternative) -->
    <rect x="655" y="160" width="80" height="600" stroke-dasharray="10 8"/>
    <!-- charnière basse (pivot au sol) -->
    <circle cx="690" cy="770" r="9" fill="#b5502f" stroke="none"/>
    <!-- vérin à gaz, du fond du caisson au dos du lit ouvert -->
    <line x1="700" y1="380" x2="900" y2="600" stroke-width="6"/>
    <!-- lit ouvert, à 42 cm du sol -->
    <path d="M690,770 L980,770 L980,650 L690,650 Z"/>
    <!-- pied d'appui du lit ouvert -->
    <line x1="975" y1="770" x2="975" y2="800"/>
    <!-- assise / fauteuil devant -->
    <path d="M760,860 q0,-30 30,-30 h60 q30,0 30,30 v40 h-120 z"/>
    <line x1="760" y1="900" x2="880" y2="900"/>
    <line x1="770" y1="800" x2="770" y2="860"/>
    <line x1="870" y1="800" x2="870" y2="860"/>
  </g>
  <text x="815" y="960" font-size="21" fill="#9c4326" font-weight="700" text-anchor="middle">COUPE — CHARNIÈRE + VÉRINS À GAZ</text>
  <text x="815" y="995" font-size="20" fill="#9c4326" text-anchor="middle">Lit ouvert : 42 cm du sol</text>
</svg>
